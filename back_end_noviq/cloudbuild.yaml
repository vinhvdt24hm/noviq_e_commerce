substitutions:
  _REGION: asia-southeast1
  _AR_REPOSITORY: noviq-containers
  _IMAGE: noviq-backend
  _SERVICE: noviq-backend
  _MIGRATION_JOB: noviq-db-migrate
  _CLOUDSQL_INSTANCE: hk261-cc-g05-507808:asia-southeast1:ecommerce-mysql
  _DATABASE_URL_SECRET: noviq-database-url
  _SECRET_KEY_SECRET: noviq-secret-key
  _RUNTIME_SERVICE_ACCOUNT: noviq-runtime@hk261-cc-g05-507808.iam.gserviceaccount.com
  _CORS_ORIGINS: https://your-frontend.example

steps:
  - id: Build backend image
    name: gcr.io/cloud-builders/docker
    dir: back_end_noviq
    args:
      - build
      - -t
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - .

  - id: Push backend image
    name: gcr.io/cloud-builders/docker
    args:
      - push
      - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$SHORT_SHA

  - id: Configure database migration job
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - deploy
      - ${_MIGRATION_JOB}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --set-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest
      - --command=flask
      - --args=--app,run,db,stamp,20261103_repair_tables
      - --max-retries=0
      - --task-timeout=10m

  - id: Run database migrations
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - jobs
      - execute
      - ${_MIGRATION_JOB}
      - --region=${_REGION}
      - --wait

  - id: Deploy backend to Cloud Run
    name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$SHORT_SHA
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --port=8080
      - --memory=512Mi
      - --service-account=${_RUNTIME_SERVICE_ACCOUNT}
      - --add-cloudsql-instances=${_CLOUDSQL_INSTANCE}
      - --set-secrets=DATABASE_URL=${_DATABASE_URL_SECRET}:latest,SECRET_KEY=${_SECRET_KEY_SECRET}:latest
      - --set-env-vars=^@^SESSION_COOKIE_SAMESITE=None@SESSION_COOKIE_SECURE=true@CORS_ORIGINS=${_CORS_ORIGINS}

images:
  - ${_REGION}-docker.pkg.dev/$PROJECT_ID/${_AR_REPOSITORY}/${_IMAGE}:$SHORT_SHA

options:
  logging: CLOUD_LOGGING_ONLY
