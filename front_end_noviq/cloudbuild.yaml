substitutions:
  _BACKEND_URL: "https://your-backend-url.run.app"

steps:
  - id: Install frontend dependencies
    name: node:22
    dir: front_end_noviq
    entrypoint: npm
    args: ["ci"]

  - id: Build frontend
    name: node:22
    dir: front_end_noviq
    entrypoint: npm
    args: ["run", "build"]
    env:
      - "VITE_API_BASE_URL=${_BACKEND_URL}"

  - id: Deploy frontend to Firebase Hosting
    name: node:22
    dir: front_end_noviq
    entrypoint: npx
    args:
      - --yes
      - firebase-tools
      - deploy
      - --only
      - hosting
      - --project=$PROJECT_ID
      - --non-interactive

options:
  logging: CLOUD_LOGGING_ONLY
